name: campus_market
description: CampusMarket, the CS310 Group 14 marketplace prototype.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: RobotoCampus
      fonts:
        - asset: assets/fonts/Roboto-400.ttf
          weight: 400
        - asset: assets/fonts/Roboto-500.ttf
          weight: 500
        - asset: assets/fonts/Roboto-600.ttf
          weight: 600
        - asset: assets/fonts/Roboto-700.ttf
          weight: 700
        - asset: assets/fonts/Roboto-800.ttf
          weight: 800
